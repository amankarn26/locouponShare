<div class="popup" [ngClass]="{searchStart: isSearch}">
    <div class="closeButton" [routerLink]="['/']">
        <div class="burger-icon">
            <span class="burger-icon-top"></span>
            <span class="burger-icon-bottom"></span>
        </div>
    </div>
    <div class="searchBox">
        <div class="inputBox">
            <input type="text" name="search" id="search" placeholder="Search..." (change)="searchQueryChange()" [(ngModel)]="searchQuery">
        </div>
    </div>
</div>

<div class="topBanner">
    <div class="pathBox">
        <div class="path">
            <div class="home" [routerLink]="['/']">
                <a href="/">Home</a>
            </div>
            <span class="cat" [routerLink]="['/']">/ &nbsp;&nbsp; Search</span>
            <span class="name">/ &nbsp;&nbsp; {{displayQuery}}</span>
        </div>
    </div>
    <div class="heading">
        <div class="searchBox">
            <div class="inputBox">
                <input type="text" name="search" id="subsearch" placeholder="Search..." (change)="searchQueryChange()" [(ngModel)]="searchQuery">
            </div>
        </div>
    </div>
</div>

<div class="infoProduct row">
    <div class="firstStatement col-md-6">We found 
        <span *ngIf="searchResult">{{searchResult.length}}</span>
        <span *ngIf="!searchResult">0</span>
        products for Search result "{{displayQuery}}"
    </div>
    <div class="secondStatement col-md-6"></div>
</div>

<div class="showProduct row" *ngIf="searchResult">
    <ng-container *ngFor="let data of searchResult; let i = index">
        <div class="col-md-3 col-sm-6">
            <div class="showAllProductMainBox">
                <div class="showProductBox" >
    
                    <!-- <div class="product-budge">
                        <span class="ShowTop orenge">TOP</span>
                    </div> -->
                    <div class="mainContain">
                        <div class="product-img" [routerLink]="['/products',data.id]">
                            <a>
                                <div class="productImageLimit">
                                    <img *ngIf="data?.img" src="{{ data?.img}}" alt="productImage">
                                </div>
                            </a>
                        </div>
                        <div class="product-action">
                            <!-- <div class="addToCart" mdbTooltip="Add to cart" placement="top" [routerLink]="['/products',data.id]">
                                <div class="addToCartButton"><img src="assets/svg/newbag.svg" alt="add Cart"></div>
                            </div>
                            <div class="wishlist" mdbTooltip="Add to Wishlist" placement="top">
                                <div class="wishlistButton"><img src="assets/svg/heartWhite.svg" alt="add Cart" (click)="addToWishList(data)">
                                </div>
                            </div>
                            <div class="compare" mdbTooltip="Compare" placement="top">
                                <div class="compareButton"><img src="assets/svg/analytics.svg" alt="add Cart"></div>
                            </div> -->
                        </div>
                    </div>
                    <div class="upperContain">
                        <div class="product-cat">
                            <a href="/">{{data?.category}}</a>
                        </div>
                        <div class="product-name">
                            <a href="/">{{ data?.name }}</a>
                        </div>
                        <!-- <div class="product-price">
                            <div class="price">
                                <bdi>
                                    &#8377; {{ data?.rateperunit }}
                                </bdi>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
        <div class="clearfix" *ngIf="(i+1) % 4 == 0"></div>
        <div class="spacer" *ngIf="(i+1) % 4 == 0"></div>
    </ng-container>
    
</div>

<div class="" style="width:100%;height:200px"></div>

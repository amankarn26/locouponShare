<div class="topBanner">
    <div class="pathBox">
        <div class="path">
            <div class="home" [routerLink]="['/']">
                <a href="/">Home</a>
            </div>
            <span class="cat" [routerLink]="['/']">/ &nbsp;&nbsp; Wishlist</span>
        </div>
    </div>
    <div class="heading">
        <div class="centralizeBox">Wishlist</div>
    </div>
</div>

<div class="mainContain" *ngIf="cartItem > 0">
    <div class="containerBox">
        <div class="row">
            <div class="col-md-12">
                <table class="tableStyle">
                    <thead>
                        <tr>
                            <th class="product-thumbnail showBold">Product</th>
                            <th class="product-name showBold">&nbsp;</th>
                            <th class="product-price showBold">Variant</th>
                            <th class="product-price showBold">Price</th>
                            <th class="product-quantity showBold">Date</th>
                            <th class="product-remove showBold">&nbsp;</th>
                            <th class="product-remove showBold">&nbsp;</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of cartData; let i = index">
                            <td class="product-thumbnail">
                                <a href="/">
                                    <img src="{{item.img}}"
                                        alt="ProductImage">
                                </a>
                            </td>
                            <td class="product-name">
                                <h6 class="product-title"><a [routerLink]="['/products',item.id]" >{{item.name}}</a></h6>
                            </td>
                            <td class="product-price">
                                <span class="woocommerce-Price-amount amount">
                                    <bdi>
                                        {{item.variant}}
                                    </bdi>
                                </span>
                            </td>
                            <td class="product-price">
                                <span class="woocommerce-Price-amount amount">
                                    <bdi *ngIf="item.price != '0'">
                                        {{item.price | currency:'INR': 'symbol'}}
                                    </bdi>
                                    <bdi *ngIf="item.price == '0'">
                                        -
                                    </bdi>
                                </span>
                            </td>
                            <td class="product-quantity">
                                <span class="woocommerce-Price-amount amount">
                                    <bdi>
                                        {{item.date}}
                                    </bdi>
                                </span>
                            </td>
                            <td class="product-remove">
                                <div class="action-btn" [routerLink]="[ '/products',item.id]">Product Details</div>
                            </td>
                            <td class="product-remove">
                                <div class="action-btn clearButton" (click)="removeProduct(i)">Remove</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row excessPadding">
            <div class="col-md-6">
                <div class="action-btn" [routerLink]="[ '/']">Continue Shopping</div>
            </div>
        </div>
        <div class="diveder"></div>
    </div>
</div>

<div class="noItemMain"  *ngIf="cartItem == 0">
    <div class="showBox">
        <div class="img"><img src="assets/svg/empty.svg" alt="empty"></div>
        <div class="text">No Item in Wishlist</div>
        <div class="action-btn" [routerLink]="[ '/']">Continue Shopping</div>
    </div>
</div>

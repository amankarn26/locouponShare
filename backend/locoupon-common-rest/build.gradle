buildscript {
	ext {
		springBootVersion = '2.2.5.RELEASE'
		dependencyManagementPluginVersion = '1.0.9.RELEASE'
		gradleVersionsPluginVersion = '0.17.0'

//		springPlatformBomVersion = 'Cairo-SR8'
		springCloudVersion = 'Hoxton.SR3'

		commonsIoVersion = '2.6'
		guavaVersion = '24.1-jre'
		jacocoVersion = '0.8.2'

		commonsValidatorVersion = '1.6'
		commonsCollectionsVersion = '4.1'
		commonsTextVersion = '1.3'
		modelMapperVersion = '1.1.2'
	}
	repositories {
		mavenLocal()
		mavenCentral()
		jcenter()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		classpath("io.spring.gradle:dependency-management-plugin:${dependencyManagementPluginVersion}")
	}
}


plugins {
	id 'org.springframework.boot' version '2.2.5.RELEASE'
	id 'io.spring.dependency-management' version '1.0.9.RELEASE'
	id 'java'
	id 'com.google.cloud.tools.jib' version '2.4.0'
	id 'war'
}

group = 'com.locoupon'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '1.8'

 bootWar { 
 	baseName = 'LoCouponManager.war'
    archiveName "${baseName}"
}

repositories {
	mavenLocal()
	mavenCentral()
	jcenter()
	maven { url 'https://repo.spring.io/libs-milestone' }
	maven { url 'http://repo.spring.io/milestone' }
}

ext {
	set('springCloudVersion', "Hoxton.SR1")
}

configurations {
	developmentOnly
	runtimeClasspath {
		extendsFrom developmentOnly
	}
	all {
           exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        }

}

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'
apply plugin: 'maven-publish'
apply plugin: 'application'

mainClassName = "com.locoupon.common.rest.SpringbootCommonServiceApplication"

dependencies {
	compile("org.projectlombok:lombok:1.18.12")
	annotationProcessor("org.projectlombok:lombok:1.18.12")
	compile 'com.locoupon:locoupon-common:1.0.0'

	compile 'org.springframework.boot:spring-boot-starter'
	compile 'org.springframework.boot:spring-boot-starter-web'
	compile 'org.springframework.boot:spring-boot-starter-data-jpa'
	compile 'org.springframework.cloud:spring-cloud-starter-stream-rabbit'
	compile('org.springframework.boot:spring-boot-starter-log4j2')
	
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
	
	compile group: 'au.com.bytecode', name: 'opencsv', version: '2.4'
	compile group: 'javax.mail', name: 'mail', version: '1.4.7'
	compile group: 'com.itextpdf', name: 'html2pdf', version: '2.1.6'
	
	compile("com.fasterxml.jackson.core:jackson-core")
	compile("com.fasterxml.jackson.core:jackson-databind")
	compile("com.fasterxml.jackson.core:jackson-annotations")
	compile("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")
	compile("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml")

	compile("com.google.guava:guava:${guavaVersion}")
	
	compile("org.apache.commons:commons-lang3")
	compile("org.apache.commons:commons-collections4:${commonsCollectionsVersion}")
	compile("org.apache.commons:commons-text:${commonsTextVersion}")
	compile("org.modelmapper:modelmapper:${modelMapperVersion}")

	runtime("io.micrometer:micrometer-registry-prometheus")
	
	compile("org.springframework.cloud:spring-cloud-starter-netflix-eureka-client")
	compile("org.springframework.boot:spring-boot-starter-actuator")
	
	testCompile 'org.springframework.amqp:spring-rabbit-test'
	testCompile 'org.springframework.cloud:spring-cloud-stream-test-support'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtime("org.postgresql:postgresql")
	implementation 'com.opencsv:opencsv:5.0'
	
	implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '2.30'
	implementation group: 'org.glassfish.jersey.core', name: 'jersey-server', version: '3.0.1'
	implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '3.9.0'
}

dependencyManagement {
	imports {
		//mavenBom("io.spring.platform:platform-bom:${springPlatformBomVersion}")
		mavenBom "org.springframework.boot:spring-boot-starter-parent:${springBootVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

//test {
//	useJUnitPlatform()
//}

publishing {
	publications {
		mavenJava(MavenPublication) {
			version  '1.0.0'
			from components.java
		}
	}
	repositories {
		mavenLocal()
	}
}
  
jib {
	to {
		image = 'drutio:443/fabricmgr/fabric-connectivity-service'
		tags = ['0.2', 'latest']
	}
}

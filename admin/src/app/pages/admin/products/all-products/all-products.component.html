<nb-card>
    <nb-card-header>
        All Products
    </nb-card-header>

    <nb-card-body>
        <ng2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)"
            (edit)="editUser($event)" (create)="addProduct()" (delete)="deleteProduct($event)">
        </ng2-smart-table>
    </nb-card-body>
</nb-card>

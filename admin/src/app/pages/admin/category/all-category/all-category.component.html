<nb-card>
    <nb-card-header>
        All Category
    </nb-card-header>

    <nb-card-body>
        <ng2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)"
            (edit)="editCategory($event)" (create)="addCategory()" (delete)="deleteCategory($event)">
        </ng2-smart-table>
    </nb-card-body>
</nb-card>

<div class="row">
    <div class="col-md-12">
        <nb-card>
            <nb-card-header>Add Product Type</nb-card-header>
            <nb-card-body>
                <form #form1="ngForm">
                    <div class="form-group">
                        <div class="form-group">
                            <nb-select name="gender" [fullWidth]="true" [(ngModel)]="sendAbleData.category" placeholder="Select Category">
                                <nb-option *ngFor="let element of allCategoryList" value={{element.name}}>{{element.name}}</nb-option>
                            </nb-select>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" nbInput fullWidth placeholder="Name" name="name"
                            [(ngModel)]="sendAbleData.name">
                    </div>
                    <div class="form-group">
                        <input type="text" nbInput fullWidth placeholder="description" name="description"
                            [(ngModel)]="sendAbleData.description">
                    </div>
                    <div class="form-group">
                        <input type="file" nbInput fullWidth placeholder="Phone No" name="phone"
                            [(ngModel)]="docSelection" (change)="fileEvent($event)" >
                    </div>
                    <div class="form-group">
                        <button type="submit" nbButton status="primary" (click)="submitForm()">Submit</button>
                    </div>
                </form>
            </nb-card-body>
        </nb-card>
    </div>
</div>
